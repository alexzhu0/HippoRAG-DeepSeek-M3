name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-14
            python: '3.11'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Install CPU PyTorch on Linux
        if: runner.os == 'Linux'
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate dependencies
        run: python -m pip check
      - name: Lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Offline regression and integration tests
        # Hosted macOS VMs advertise MPS but cannot reliably execute Metal kernels.
        # Run hardware tests separately on a physical/self-hosted Mac.
        run: python -m pytest -q -m "not mps"
      - name: Environment diagnostics
        run: python test_env.py --offline
      - name: Shell syntax
        run: bash -n setup_env.sh
